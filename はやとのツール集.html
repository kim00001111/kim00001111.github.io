const S={"routine": "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<title>今日のルーティン<\/title>\n<style>\n:root{\n    --bg-0:#0b0c0f;\n    --bg-1:#151619;\n    --card:#1c1d21;\n    --card-2:#232429;\n    --line:rgba(255,255,255,0.08);\n    --text-0:#f2f2f4;\n    --text-1:#9a9ba1;\n    --text-2:#5c5d63;\n    --accent:#5ec8d8;\n    --accent-dim:rgba(94,200,216,0.15);\n    --work:#e8a15c;\n    --work-dim:rgba(232,161,92,0.15);\n    --run:#7fd68a;\n    --bath:#8fb3ff;\n    --radius:20px;\n  }\n  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}\n  html,body{height:100%;}\n  body{\n    margin:0;\n    background:\n      radial-gradient(circle at 15% 0%, rgba(94,200,216,0.06), transparent 55%),\n      radial-gradient(circle at 85% 100%, rgba(232,161,92,0.05), transparent 55%),\n      var(--bg-0);\n    color:var(--text-0);\n    font-family:-apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Hiragino Sans\", \"Hiragino Kaku Gothic ProN\", \"Noto Sans JP\", sans-serif;\n    min-height:100%;\n    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;\n  }\n  .wrap{\n    max-width:480px;\n    margin:0 auto;\n    padding:28px 20px 60px;\n  }\n\n  /* Header / toggle */\n  .top{\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    margin-bottom:22px;\n  }\n  .date-label{\n    font-size:13px;\n    color:var(--text-1);\n    letter-spacing:0.02em;\n  }\n  .date-label b{color:var(--text-0); font-weight:600;}\n\n  .switch-group{\n    display:flex;\n    background:var(--card);\n    border:1px solid var(--line);\n    border-radius:999px;\n    padding:3px;\n    gap:2px;\n  }\n  .switch-btn{\n    border:none;\n    background:transparent;\n    color:var(--text-1);\n    font-size:12.5px;\n    font-weight:600;\n    padding:7px 12px;\n    border-radius:999px;\n    cursor:pointer;\n    transition:all .25s ease;\n    font-family:inherit;\n    white-space:nowrap;\n  }\n  .switch-btn.active{\n    background:var(--text-0);\n    color:#0b0c0f;\n  }\n\n  /* Now card */\n  .now-card{\n    background:linear-gradient(180deg, var(--card-2), var(--card));\n    border:1px solid var(--line);\n    border-radius:var(--radius);\n    padding:26px 24px;\n    margin-bottom:16px;\n    position:relative;\n    overflow:hidden;\n  }\n  .now-card::after{\n    content:\"\";\n    position:absolute;\n    top:-40%; right:-20%;\n    width:220px; height:220px;\n    background:radial-gradient(circle, var(--tag-color, var(--accent)) 0%, transparent 70%);\n    opacity:0.12;\n    pointer-events:none;\n  }\n  .clock{\n    font-size:44px;\n    font-weight:700;\n    letter-spacing:-0.02em;\n    font-variant-numeric:tabular-nums;\n    line-height:1;\n    margin-bottom:14px;\n    color:var(--text-0);\n  }\n  .clock span{color:var(--text-2); font-size:22px; font-weight:500; margin-left:4px;}\n  .now-label{\n    font-size:11px;\n    text-transform:uppercase;\n    letter-spacing:0.12em;\n    color:var(--text-1);\n    margin-bottom:6px;\n    font-weight:600;\n  }\n  .now-task{\n    font-size:24px;\n    font-weight:700;\n    color:var(--text-0);\n    margin-bottom:14px;\n    line-height:1.3;\n  }\n  .progress-track{\n    height:5px;\n    border-radius:99px;\n    background:rgba(255,255,255,0.07);\n    overflow:hidden;\n    margin-bottom:10px;\n  }\n  .progress-fill{\n    height:100%;\n    border-radius:99px;\n    background:var(--tag-color, var(--accent));\n    transition:width .6s ease;\n  }\n  .now-meta{\n    display:flex;\n    justify-content:space-between;\n    font-size:12.5px;\n    color:var(--text-1);\n  }\n  .now-meta b{color:var(--text-0); font-weight:600;}\n\n  .next-card{\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    background:var(--card);\n    border:1px solid var(--line);\n    border-radius:14px;\n    padding:14px 18px;\n    margin-bottom:28px;\n    font-size:13.5px;\n    color:var(--text-1);\n  }\n  .next-card b{color:var(--text-0); font-weight:600;}\n  .next-time{\n    font-variant-numeric:tabular-nums;\n    color:var(--text-1);\n    font-size:12.5px;\n  }\n\n  /* Timeline */\n  .section-title{\n    font-size:12px;\n    text-transform:uppercase;\n    letter-spacing:0.1em;\n    color:var(--text-2);\n    font-weight:700;\n    margin:0 4px 12px;\n  }\n  .timeline{\n    position:relative;\n    padding-left:20px;\n  }\n  .timeline::before{\n    content:\"\";\n    position:absolute;\n    left:5px; top:6px; bottom:6px;\n    width:1.5px;\n    background:var(--line);\n  }\n  .item{\n    position:relative;\n    padding:0 0 22px 18px;\n    opacity:0.55;\n    transition:opacity .3s ease;\n  }\n  .item:last-child{padding-bottom:0;}\n  .item::before{\n    content:\"\";\n    position:absolute;\n    left:-20px; top:3px;\n    width:9px; height:9px;\n    border-radius:50%;\n    background:var(--text-2);\n    border:2px solid var(--bg-0);\n  }\n  .item.done{opacity:0.3;}\n  .item.done::before{background:var(--text-2);}\n  .item.current{\n    opacity:1;\n  }\n  .item.current::before{\n    background:var(--tag-color, var(--accent));\n    box-shadow:0 0 0 4px var(--tag-color-dim, var(--accent-dim));\n  }\n  .item-time{\n    font-size:11.5px;\n    color:var(--text-2);\n    font-variant-numeric:tabular-nums;\n    margin-bottom:2px;\n  }\n  .item.current .item-time{color:var(--text-1);}\n  .item-name{\n    font-size:15px;\n    font-weight:500;\n    color:var(--text-1);\n  }\n  .item.current .item-name{\n    color:var(--text-0);\n    font-weight:600;\n  }\n  .tag{\n    display:inline-block;\n    font-size:10px;\n    font-weight:700;\n    padding:2px 7px;\n    border-radius:6px;\n    margin-left:8px;\n    vertical-align:middle;\n    letter-spacing:0.02em;\n  }\n  .tag.work{background:var(--work-dim); color:var(--work);}\n  .tag.run{background:rgba(127,214,138,0.15); color:var(--run);}\n  .tag.bath{background:rgba(143,179,255,0.15); color:var(--bath);}\n\n  footer{\n    text-align:center;\n    color:var(--text-2);\n    font-size:11px;\n    margin-top:32px;\n  }\n\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"top\">\n    <div class=\"date-label\" id=\"dateLabel\">-<\/div>\n    <div class=\"switch-group\">\n      <button class=\"switch-btn\" id=\"btnOff\">オフ日<\/button>\n      <button class=\"switch-btn\" id=\"btnWork\">バイト日<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"now-card\" id=\"nowCard\">\n    <div class=\"clock\" id=\"clock\">--:--<span id=\"sec\">--<\/span><\/div>\n    <div class=\"now-label\">Now<\/div>\n    <div class=\"now-task\" id=\"nowTask\">読み込み中…<\/div>\n    <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\" style=\"width:0%\"><\/div><\/div>\n    <div class=\"now-meta\">\n      <span id=\"elapsedLabel\">-<\/span>\n      <span id=\"remainLabel\">-<\/span>\n    <\/div>\n  <\/div>\n\n  <div class=\"next-card\">\n    <span>次は <b id=\"nextTask\">-<\/b><\/span>\n    <span class=\"next-time\" id=\"nextTime\">-<\/span>\n  <\/div>\n\n  <div class=\"section-title\">Today's Timeline<\/div>\n  <div class=\"timeline\" id=\"timeline\"><\/div>\n\n  <footer>はやとの完璧ルーティン &middot; 自動同期<\/footer>\n<\/div>\n\n<script>\nconst SCHEDULES = {\n  off: [\n    [\"09:30\",\"10:00\",\"起床・身支度・朝食\"],\n    [\"10:00\",\"10:20\",\"読書\"],\n    [\"10:20\",\"10:35\",\"単語\"],\n    [\"10:35\",\"12:00\",\"勉強①\"],\n    [\"12:00\",\"13:00\",\"昼食・休憩\"],\n    [\"13:00\",\"15:15\",\"勉強②\"],\n    [\"15:15\",\"15:30\",\"休憩・自重筋トレ\",\"tag\"],\n    [\"15:30\",\"17:30\",\"勉強③\"],\n    [\"17:30\",\"18:30\",\"夕食\"],\n    [\"18:30\",\"20:00\",\"勉強④\"],\n    [\"20:00\",\"20:45\",\"ランニング\",\"run\"],\n    [\"20:45\",\"21:15\",\"クールダウン・お風呂\",\"bath\"],\n    [\"21:15\",\"22:00\",\"勉強⑤\"],\n    [\"22:00\",\"22:15\",\"単語(復習)\"],\n    [\"22:15\",\"23:15\",\"自由時間\"],\n    [\"23:15\",\"23:45\",\"翌日準備・ストレッチ\"],\n    [\"00:00\",\"09:30\",\"就寝\",\"\", true]\n  ],\n  work: [\n    [\"09:30\",\"10:00\",\"起床・身支度・朝食\"],\n    [\"10:00\",\"10:20\",\"読書\"],\n    [\"10:20\",\"10:35\",\"単語\"],\n    [\"10:35\",\"12:00\",\"勉強①\"],\n    [\"12:00\",\"13:00\",\"昼食・休憩・自重筋トレ\"],\n    [\"13:00\",\"15:00\",\"勉強②\"],\n    [\"15:00\",\"15:45\",\"準備・軽食・移動\"],\n    [\"16:00\",\"20:00\",\"バイト\",\"work\"],\n    [\"20:00\",\"20:15\",\"帰宅・休憩\"],\n    [\"20:15\",\"21:00\",\"ランニング\",\"run\"],\n    [\"21:00\",\"21:30\",\"クールダウン・お風呂\",\"bath\"],\n    [\"21:30\",\"22:15\",\"夕食\"],\n    [\"22:15\",\"23:00\",\"勉強③\"],\n    [\"23:00\",\"23:15\",\"単語(復習)\"],\n    [\"23:15\",\"23:45\",\"自由時間・ストレッチ\"],\n    [\"00:00\",\"09:30\",\"就寝\",\"\", true]\n  ]\n};\n\nconst TAG_LABELS = {work:\"バイト\", run:\"ラン\", bath:\"入浴\"};\nconst TAG_COLORS = {\n  work: {main:\"#e8a15c\", dim:\"rgba(232,161,92,0.15)\"},\n  run:  {main:\"#7fd68a\", dim:\"rgba(127,214,138,0.15)\"},\n  bath: {main:\"#8fb3ff\", dim:\"rgba(143,179,255,0.15)\"}\n};\n\nlet mode = \"off\";\n\nfunction toMinutes(hhmm){\n  const [h,m] = hhmm.split(\":\").map(Number);\n  return h*60+m;\n}\n\nfunction fmtMin(mins){\n  const h = Math.floor(mins/60), m = mins%60;\n  return h+\"時間\"+(m>0? m+\"分\":\"\");\n}\n\nfunction pad(n){return n.toString().padStart(2,\"0\");}\n\nfunction render(){\n  const now = new Date();\n  const nowMin = now.getHours()*60 + now.getMinutes();\n  const nowMinExact = nowMin + now.getSeconds()/60;\n\n  document.getElementById(\"clock\").innerHTML =\n    pad(now.getHours())+\":\"+pad(now.getMinutes())+\"<span>\"+pad(now.getSeconds())+\"<\/span>\";\n\n  const days = [\"日\",\"月\",\"火\",\"水\",\"木\",\"金\",\"土\"];\n  document.getElementById(\"dateLabel\").innerHTML =\n    (now.getMonth()+1)+\"月\"+now.getDate()+\"日 (<b>\"+days[now.getDay()]+\"<\/b>)\";\n\n  const schedule = SCHEDULES[mode];\n  let currentIdx = -1;\n\n  // build timeline\n  const tl = document.getElementById(\"timeline\");\n  tl.innerHTML = \"\";\n\n  schedule.forEach((item, i)=>{\n    const [start, end, label, tag] = item;\n    let s = toMinutes(start);\n    let e = toMinutes(end);\n    if (e <= s) e += 24*60; // crosses midnight\n\n    let effectiveNow = nowMinExact;\n    // handle wraparound: if item is overnight block and current time is early morning\n    let isCurrent = false;\n    if (effectiveNow >= s && effectiveNow < e){\n      isCurrent = true;\n    } else if (e > 24*60 && effectiveNow < (e-24*60)){\n      isCurrent = true;\n      effectiveNow += 24*60;\n    }\n\n    const div = document.createElement(\"div\");\n    div.className = \"item\" + (isCurrent ? \" current\" : (effectiveNow >= e ? \" done\" : \"\"));\n    let tagHtml = \"\";\n    if (tag && TAG_LABELS[tag]){\n      tagHtml = '<span class=\"tag '+tag+'\">'+TAG_LABELS[tag]+'<\/span>';\n    }\n    div.innerHTML =\n      '<div class=\"item-time\">'+start+' – '+end+'<\/div>'+\n      '<div class=\"item-name\">'+label+tagHtml+'<\/div>';\n    tl.appendChild(div);\n\n    if (isCurrent){\n      currentIdx = i;\n      const dur = e - s;\n      const elapsed = effectiveNow - s;\n      const pct = Math.min(100, Math.max(0, (elapsed/dur)*100));\n      document.getElementById(\"nowTask\").textContent = label;\n      document.getElementById(\"progressFill\").style.width = pct+\"%\";\n      document.getElementById(\"elapsedLabel\").textContent = fmtMin(Math.round(elapsed))+\" 経過\";\n      document.getElementById(\"remainLabel\").textContent = \"残り \"+fmtMin(Math.round(dur-elapsed));\n\n      const color = tag && TAG_COLORS[tag] ? TAG_COLORS[tag] : null;\n      const nowCard = document.getElementById(\"nowCard\");\n      nowCard.style.setProperty(\"--tag-color\", color ? color.main : \"#5ec8d8\");\n      document.getElementById(\"progressFill\").style.background = color ? color.main : \"#5ec8d8\";\n    }\n  });\n\n  // next item\n  if (currentIdx >= 0){\n    const nextIdx = (currentIdx+1) % schedule.length;\n    const nextItem = schedule[nextIdx];\n    document.getElementById(\"nextTask\").textContent = nextItem[2];\n    document.getElementById(\"nextTime\").textContent = nextItem[0]+\"〜\";\n  }\n\n  // sync current item highlight color on timeline dot\n  document.querySelectorAll(\".item.current\").forEach(el=>{\n    const tagEl = el.querySelector(\".tag\");\n    if (tagEl){\n      const cls = [...tagEl.classList].find(c=>c!==\"tag\");\n      const color = TAG_COLORS[cls];\n      if (color){\n        el.style.setProperty(\"--tag-color\", color.main);\n        el.style.setProperty(\"--tag-color-dim\", color.dim);\n      }\n    }\n  });\n}\n\nfunction setMode(newMode){\n  mode = newMode;\n  document.getElementById(\"btnOff\").classList.toggle(\"active\", mode===\"off\");\n  document.getElementById(\"btnWork\").classList.toggle(\"active\", mode===\"work\");\n  render();\n}\n\ndocument.getElementById(\"btnOff\").addEventListener(\"click\", ()=>setMode(\"off\"));\ndocument.getElementById(\"btnWork\").addEventListener(\"click\", ()=>setMode(\"work\"));\n\nsetMode(\"off\");\nsetInterval(render, 1000);\n\n<\/script>\n<\/body>\n<\/html>\n", "money": "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>収支 — バイト代とお支払いの記録<\/title>\n<style>\n  :root{\n    --bg:#f5f5f7;\n    --card:#ffffff;\n    --ink:#1d1d1f;\n    --gray:#6e6e73;\n    --gray-light:#86868b;\n    --hairline:rgba(0,0,0,.08);\n    --blue:#0071e3;\n    --blue-dark:#0058b3;\n    --green:#2fa84f;\n    --green-soft:#e6f6ea;\n    --red:#e8433a;\n    --red-soft:#fdeceb;\n    --chip-bg:#f5f5f7;\n  }\n\n  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }\n  html{ scroll-behavior:smooth; }\n\n  body{\n    margin:0;\n    background:var(--bg);\n    color:var(--ink);\n    font-family:-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"Hiragino Sans\", \"Hiragino Kaku Gothic ProN\", \"Noto Sans JP\", \"Yu Gothic\", sans-serif;\n    letter-spacing:-.01em;\n  }\n\n  nav{\n    position:sticky;\n    top:0;\n    z-index:10;\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    padding:0 20px;\n    height:52px;\n    background:rgba(255,255,255,.8);\n    backdrop-filter:saturate(180%) blur(20px);\n    -webkit-backdrop-filter:saturate(180%) blur(20px);\n    border-bottom:1px solid var(--hairline);\n  }\n  nav .brand{\n    font-size:14px;\n    font-weight:600;\n    color:var(--ink);\n  }\n  .nav-actions{\n    display:flex;\n    gap:8px;\n  }\n  .nav-btn{\n    background:transparent;\n    border:1px solid var(--hairline);\n    border-radius:8px;\n    padding:4px 10px;\n    font-size:12px;\n    font-weight:600;\n    color:var(--gray);\n    cursor:pointer;\n  }\n  .nav-btn:hover{ border-color:var(--blue); color:var(--blue); }\n\n  .hero{\n    text-align:center;\n    padding:36px 20px 30px;\n    max-width:800px;\n    margin:0 auto;\n  }\n\n  /* 全体累計・月切替のコンテナ */\n  .hero-stats-bar{\n    display:flex;\n    justify-content:center;\n    align-items:center;\n    gap:16px;\n    margin-bottom:16px;\n    flex-wrap:wrap;\n  }\n  .alltime-badge{\n    background:var(--card);\n    padding:6px 16px;\n    border-radius:999px;\n    box-shadow:0 2px 6px rgba(0,0,0,.04);\n    font-size:13px;\n    font-weight:600;\n    color:var(--gray);\n  }\n  .alltime-badge span{\n    font-weight:700;\n    font-variant-numeric:tabular-nums;\n  }\n  .alltime-badge span.plus{ color:var(--green); }\n  .alltime-badge span.minus{ color:var(--red); }\n\n  .month-selector{\n    display:inline-flex;\n    align-items:center;\n    gap:12px;\n    background:var(--card);\n    padding:6px 16px;\n    border-radius:999px;\n    box-shadow:0 2px 6px rgba(0,0,0,.04);\n  }\n  .month-selector button{\n    background:none;\n    border:none;\n    font-size:14px;\n    cursor:pointer;\n    color:var(--blue);\n    font-weight:600;\n  }\n  .month-selector span{\n    font-size:15px;\n    font-weight:700;\n  }\n\n  .hero .eyebrow{\n    font-size:13px;\n    font-weight:600;\n    color:var(--gray);\n    margin-bottom:6px;\n  }\n  .hero h1{\n    margin:0;\n    font-size:clamp(36px, 6vw, 56px);\n    font-weight:700;\n    letter-spacing:-.03em;\n    line-height:1.05;\n  }\n  .hero h1.plus{ color:var(--ink); }\n  .hero h1.minus{ color:var(--red); }\n  .hero .sub{\n    margin:10px auto 0;\n    max-width:480px;\n    font-size:15px;\n    color:var(--gray);\n    line-height:1.4;\n  }\n\n  .status-pill{\n    display:inline-flex;\n    align-items:center;\n    gap:6px;\n    margin-top:16px;\n    padding:6px 14px;\n    border-radius:999px;\n    font-size:13px;\n    font-weight:600;\n  }\n  .status-pill.plus{ background:var(--green-soft); color:var(--green); }\n  .status-pill.minus{ background:var(--red-soft); color:var(--red); }\n\n  .meter{\n    max-width:420px;\n    margin:20px auto 0;\n    height:8px;\n    border-radius:999px;\n    background:#e8e8ed;\n    overflow:hidden;\n  }\n  .meter-fill{\n    height:100%;\n    border-radius:999px;\n    transition:width .4s cubic-bezier(.4,0,.2,1);\n  }\n  .meter-fill.plus{ background:linear-gradient(90deg, #34c759, #30b350); }\n  .meter-fill.minus{ background:linear-gradient(90deg, #ff453a, #e8433a); }\n\n  .wrap{\n    max-width:1040px;\n    margin:0 auto;\n    padding:0 20px 80px;\n    display:flex;\n    flex-direction:column;\n    align-items:center;\n    gap:24px;\n  }\n\n  .columns{\n    display:grid;\n    grid-template-columns:repeat(2, minmax(0, 480px));\n    justify-content:center;\n    gap:24px;\n    width:100%;\n  }\n  @media (max-width:980px){\n    .columns{ grid-template-columns:minmax(0, 480px); }\n  }\n\n  .panel{\n    background:var(--card);\n    border-radius:22px;\n    padding:28px;\n    box-shadow:0 2px 8px rgba(0,0,0,.04), 0 20px 40px -24px rgba(0,0,0,.12);\n    width:100%;\n  }\n  .panel h2{\n    font-size:20px;\n    font-weight:700;\n    margin:0 0 2px;\n  }\n  .panel .subtotal{\n    font-size:30px;\n    font-weight:700;\n    margin:2px 0 16px;\n    font-variant-numeric:tabular-nums;\n  }\n  .panel.income .subtotal{ color:var(--green); }\n  .panel.expense .subtotal{ color:var(--red); }\n\n  .card-breakdown{\n    margin-top:16px;\n    padding-top:16px;\n    border-top:1px solid var(--hairline);\n  }\n  .card-breakdown-title{\n    font-size:13px;\n    font-weight:600;\n    color:var(--gray);\n    margin-bottom:8px;\n  }\n  .card-bar-item{\n    margin-bottom:8px;\n  }\n  .card-bar-info{\n    display:flex;\n    justify-content:space-between;\n    font-size:13px;\n    margin-bottom:3px;\n  }\n  .card-bar-track{\n    height:6px;\n    background:#e8e8ed;\n    border-radius:999px;\n    overflow:hidden;\n  }\n  .card-bar-fill{\n    height:100%;\n    background:var(--blue);\n    border-radius:999px;\n  }\n\n  .chips{\n    display:flex;\n    flex-wrap:wrap;\n    gap:8px;\n    margin-bottom:16px;\n  }\n  .chip{\n    display:flex;\n    align-items:center;\n    gap:4px;\n    background:var(--chip-bg);\n    border:none;\n    border-radius:999px;\n    padding:6px 8px 6px 14px;\n    font-size:13px;\n    font-weight:500;\n    cursor:pointer;\n    color:var(--ink);\n  }\n  .chip .chip-remove{\n    background:none;\n    border:none;\n    color:var(--gray-light);\n    font-size:14px;\n    cursor:pointer;\n    padding:2px 5px;\n    border-radius:50%;\n  }\n  .chip .chip-remove:hover{ color:var(--red); background:rgba(0,0,0,.06); }\n  .chip-add{\n    background:transparent;\n    border:1px dashed #c7c7cc;\n    color:var(--gray);\n    padding:6px 14px;\n  }\n  .chip-add:hover{ border-color:var(--blue); color:var(--blue); }\n\n  .entry-form{\n    display:flex;\n    flex-direction:column;\n    gap:8px;\n    margin-bottom:16px;\n  }\n  .form-row{\n    display:flex;\n    gap:8px;\n  }\n  .entry-form input{\n    font-family:inherit;\n    border:1px solid var(--hairline);\n    background:#fbfbfd;\n    border-radius:10px;\n    padding:10px 12px;\n    font-size:14px;\n    color:var(--ink);\n    width:100%;\n  }\n  .entry-form input:focus{\n    outline:none;\n    border-color:var(--blue);\n    background:#fff;\n    box-shadow:0 0 0 3px rgba(0,113,227,.12);\n  }\n  .f-date{ flex:1; }\n  .f-name{ flex:1.5; }\n  .f-amount{ flex:1; font-variant-numeric:tabular-nums; }\n\n  .add-btn{\n    border:none;\n    border-radius:10px;\n    padding:10px;\n    font-family:inherit;\n    font-weight:600;\n    font-size:14px;\n    cursor:pointer;\n    color:#fff;\n    background:var(--blue);\n    transition:background .15s ease;\n  }\n  .add-btn:hover{ background:var(--blue-dark); }\n\n  ul.entries{\n    list-style:none;\n    margin:0; padding:0;\n    display:flex;\n    flex-direction:column;\n    max-height:240px;\n    overflow-y:auto;\n  }\n  ul.entries li{\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    gap:8px;\n    padding:10px 4px;\n    border-bottom:1px solid var(--hairline);\n    font-size:14px;\n  }\n  ul.entries li .date-badge{\n    font-size:11px;\n    color:var(--gray);\n    background:var(--bg);\n    padding:2px 6px;\n    border-radius:4px;\n    flex-shrink:0;\n  }\n  ul.entries li .name{\n    flex:1;\n    overflow:hidden;\n    text-overflow:ellipsis;\n    white-space:nowrap;\n    cursor:pointer;\n  }\n  ul.entries li .name:hover{ color:var(--blue); text-decoration:underline; }\n  ul.entries li .amt{\n    font-weight:600;\n    flex-shrink:0;\n    font-variant-numeric:tabular-nums;\n    cursor:pointer;\n  }\n  .panel.income li .amt{ color:var(--green); }\n  .panel.expense li .amt{ color:var(--red); }\n  ul.entries li .del{\n    background:none;\n    border:none;\n    color:var(--gray-light);\n    cursor:pointer;\n    font-size:15px;\n    padding:2px 4px;\n    border-radius:50%;\n  }\n  ul.entries li .del:hover{ color:var(--red); background:rgba(0,0,0,.05); }\n\n  .empty{\n    font-size:13px;\n    color:var(--gray-light);\n    padding:12px 2px;\n  }\n\n  .trend-panel{\n    background:var(--card);\n    border-radius:22px;\n    padding:24px 28px;\n    box-shadow:0 2px 8px rgba(0,0,0,.04), 0 20px 40px -24px rgba(0,0,0,.12);\n    width:100%;\n  }\n  .trend-panel h3{\n    font-size:18px;\n    font-weight:700;\n    margin:0 0 16px;\n  }\n  .trend-bars{\n    display:flex;\n    align-items:flex-end;\n    gap:16px;\n    height:140px;\n    padding-top:20px;\n    border-bottom:1px solid var(--hairline);\n    overflow-x:auto;\n  }\n  .trend-col{\n    flex:1;\n    display:flex;\n    flex-direction:column;\n    align-items:center;\n    min-width:60px;\n    height:100%;\n    justify-content:flex-end;\n  }\n  .trend-bar-wrapper{\n    width:28px;\n    height:100px;\n    display:flex;\n    align-items:flex-end;\n    background:#f2f2f7;\n    border-radius:6px;\n    overflow:hidden;\n  }\n  .trend-bar-fill{\n    width:100%;\n    border-radius:6px 6px 0 0;\n    transition:height .3s;\n  }\n  .trend-bar-fill.plus{ background:var(--green); }\n  .trend-bar-fill.minus{ background:var(--red); }\n  .trend-label{\n    font-size:12px;\n    color:var(--gray);\n    margin-top:8px;\n    white-space:nowrap;\n  }\n\n  footer{\n    text-align:center;\n    font-size:12px;\n    color:var(--gray-light);\n    width:100%;\n    margin-top:10px;\n  }\n<\/style>\n<\/head>\n<body>\n\n<nav>\n  <span class=\"brand\">収支<\/span>\n  <div class=\"nav-actions\">\n    <button class=\"nav-btn\" onclick=\"exportCSV()\">CSVバックアップ<\/button>\n  <\/div>\n<\/nav>\n\n<div class=\"hero\">\n  <div class=\"hero-stats-bar\">\n    <!-- 全体累計バッジ -->\n    <div class=\"alltime-badge\">\n      全体累計: <span id=\"alltimeNumber\" class=\"plus\">¥0<\/span>\n    <\/div>\n    <!-- 月別セレクター -->\n    <div class=\"month-selector\">\n      <button onclick=\"changeMonth(-1)\">◀ 前月<\/button>\n      <span id=\"currentMonthLabel\">2026年9月<\/span>\n      <button onclick=\"changeMonth(1)\">次月 ▶<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"eyebrow\" id=\"heroEyebrow\">今月の収支<\/div>\n  <h1 id=\"balanceNumber\" class=\"plus\">¥0<\/h1>\n  <div id=\"statusPill\" class=\"status-pill plus\">プラス<\/div>\n  <div class=\"meter\"><div id=\"meterFill\" class=\"meter-fill plus\" style=\"width:0%\"><\/div><\/div>\n  <p class=\"sub\">バイト代とお支払い・カード利用を月別にスマートに管理。<\/p>\n<\/div>\n\n<div class=\"wrap\">\n  <div class=\"columns\">\n    <!-- 収入パネル -->\n    <section class=\"panel income\">\n      <h2>収入<\/h2>\n      <div id=\"incomeSubtotal\" class=\"subtotal\">¥0<\/div>\n      <div class=\"chips\" id=\"incomeChips\"><\/div>\n      <form class=\"entry-form\" id=\"incomeForm\">\n        <div class=\"form-row\">\n          <input class=\"f-date\" type=\"date\" required>\n        <\/div>\n        <div class=\"form-row\">\n          <input class=\"f-name\" type=\"text\" placeholder=\"項目（例：バイト代）\" required>\n          <input class=\"f-amount\" type=\"number\" placeholder=\"金額\" min=\"0\" step=\"1\" required>\n          <button type=\"submit\" class=\"add-btn\">追加<\/button>\n        <\/div>\n      <\/form>\n      <ul class=\"entries\" id=\"incomeList\"><\/ul>\n    <\/section>\n\n    <!-- 支出パネル -->\n    <section class=\"panel expense\">\n      <h2>支出<\/h2>\n      <div id=\"expenseSubtotal\" class=\"subtotal\">¥0<\/div>\n      <div class=\"chips\" id=\"expenseChips\"><\/div>\n      <form class=\"entry-form\" id=\"expenseForm\">\n        <div class=\"form-row\">\n          <input class=\"f-date\" type=\"date\" required>\n        <\/div>\n        <div class=\"form-row\">\n          <input class=\"f-name\" type=\"text\" placeholder=\"項目（例：メルカード）\" required>\n          <input class=\"f-amount\" type=\"number\" placeholder=\"金額\" min=\"0\" step=\"1\" required>\n          <button type=\"submit\" class=\"add-btn\">追加<\/button>\n        <\/div>\n      <\/form>\n      <ul class=\"entries\" id=\"expenseList\"><\/ul>\n      <!-- カード別内訳 -->\n      <div class=\"card-breakdown\" id=\"cardBreakdown\">\n        <div class=\"card-breakdown-title\">カード・主要支払いの内訳<\/div>\n        <div id=\"cardBreakdownList\"><\/div>\n      <\/div>\n    <\/section>\n  <\/div>\n\n  <!-- 簡易グラフ（推移） -->\n  <section class=\"trend-panel\">\n    <h3>直近の収支推移<\/h3>\n    <div class=\"trend-bars\" id=\"trendBars\"><\/div>\n  <\/section>\n\n  <footer>入力内容とよく使う項目は、このブラウザに自動保存されます。<\/footer>\n<\/div>\n\n<script>\n  const DATA_KEY = 'shushicho-data-v2';\n  const PRESET_KEY = 'shushicho-presets-v1';\n\n  const DEFAULT_PRESETS = {\n    income: ['バイト代'],\n    expense: ['メルカード', 'PayPayカード', 'Viewカード']\n  };\n\n  let viewingDate = new Date();\n  viewingDate.setDate(1);\n\n  function loadJSON(key, fallback){\n    try{\n      const raw = localStorage.getItem(key);\n      if(!raw) return fallback;\n      return JSON.parse(raw) || fallback;\n    }catch(e){ return fallback; }\n  }\n\n  let state = loadJSON(DATA_KEY, { income: [], expense: [] });\n  let presets = loadJSON(PRESET_KEY, DEFAULT_PRESETS);\n\n  function saveData(){\n    try{ localStorage.setItem(DATA_KEY, JSON.stringify(state)); }catch(e){}\n  }\n  function savePresets(){\n    try{ localStorage.setItem(PRESET_KEY, JSON.stringify(presets)); }catch(e){}\n  }\n\n  const fmt = n => '¥' + n.toLocaleString('ja-JP');\n\n  function getTodayString() {\n    const d = new Date();\n    const year = d.getFullYear();\n    const month = String(d.getMonth() + 1).padStart(2, '0');\n    const day = String(d.getDate()).padStart(2, '0');\n    return `${year}-${month}-${day}`;\n  }\n\n  document.querySelectorAll('.f-date').forEach(el => el.value = getTodayString());\n\n  function changeMonth(diff){\n    viewingDate.setMonth(viewingDate.getMonth() + diff);\n    render();\n  }\n\n  function getFilteredEntries(type) {\n    const y = viewingDate.getFullYear();\n    const m = viewingDate.getMonth();\n    return state[type].filter(item => {\n      const d = new Date(item.date);\n      return d.getFullYear() === y && d.getMonth() === m;\n    });\n  }\n\n  function renderChips(type){\n    const container = document.getElementById(type + 'Chips');\n    container.innerHTML = '';\n\n    presets[type].forEach((label, idx) => {\n      const chip = document.createElement('div');\n      chip.className = 'chip';\n\n      const text = document.createElement('span');\n      text.textContent = label;\n      text.addEventListener('click', () => {\n        const form = document.getElementById(type + 'Form');\n        form.querySelector('.f-name').value = label;\n        form.querySelector('.f-amount').focus();\n      });\n\n      const remove = document.createElement('button');\n      remove.className = 'chip-remove';\n      remove.type = 'button';\n      remove.textContent = '×';\n      remove.addEventListener('click', (e) => {\n        e.stopPropagation();\n        presets[type].splice(idx, 1);\n        savePresets();\n        renderChips(type);\n      });\n\n      chip.appendChild(text);\n      chip.appendChild(remove);\n      container.appendChild(chip);\n    });\n\n    const addChip = document.createElement('button');\n    addChip.type = 'button';\n    addChip.className = 'chip chip-add';\n    addChip.textContent = '＋よく使う項目';\n    addChip.addEventListener('click', () => {\n      const label = window.prompt('よく使う項目の名前を入力してください');\n      const trimmed = (label || '').trim();\n      if(!trimmed || presets[type].includes(trimmed)) return;\n      presets[type].push(trimmed);\n      savePresets();\n      renderChips(type);\n    });\n    container.appendChild(addChip);\n  }\n\n  function render(){\n    const y = viewingDate.getFullYear();\n    const m = viewingDate.getMonth() + 1;\n    document.getElementById('currentMonthLabel').textContent = `${y}年${m}月`;\n    \n    const now = new Date();\n    const isCurrentMonth = (now.getFullYear() === viewingDate.getFullYear() && now.getMonth() === viewingDate.getMonth());\n    document.getElementById('heroEyebrow').textContent = isCurrentMonth ? '今月の収支' : `${y}年${m}月の収支`;\n\n    // 全体累計（全期間の合計）の計算\n    const allIncomeTotal = state.income.reduce((s,e)=>s+e.amount, 0);\n    const allExpenseTotal = state.expense.reduce((s,e)=>s+e.amount, 0);\n    const allNet = allIncomeTotal - allExpenseTotal;\n    const alltimeEl = document.getElementById('alltimeNumber');\n    alltimeEl.textContent = (allNet >= 0 ? '¥' : '−¥') + Math.abs(allNet).toLocaleString('ja-JP');\n    alltimeEl.className = allNet >= 0 ? 'plus' : 'minus';\n\n    renderList('income');\n    renderList('expense');\n    renderCardBreakdown();\n    renderTrend();\n    saveData();\n\n    const incomeList = getFilteredEntries('income');\n    const expenseList = getFilteredEntries('expense');\n    const incomeTotal = incomeList.reduce((s,e)=>s+e.amount,0);\n    const expenseTotal = expenseList.reduce((s,e)=>s+e.amount,0);\n    const net = incomeTotal - expenseTotal;\n\n    document.getElementById('incomeSubtotal').textContent = fmt(incomeTotal);\n    document.getElementById('expenseSubtotal').textContent = fmt(expenseTotal);\n\n    const balanceEl = document.getElementById('balanceNumber');\n    const pillEl = document.getElementById('statusPill');\n    const meterEl = document.getElementById('meterFill');\n    const isPlus = net >= 0;\n\n    balanceEl.textContent = (isPlus ? '¥' : '−¥') + Math.abs(net).toLocaleString('ja-JP');\n    balanceEl.className = isPlus ? 'plus' : 'minus';\n    pillEl.className = 'status-pill ' + (isPlus ? 'plus' : 'minus');\n    pillEl.textContent = isPlus ? 'プラス' : 'マイナス';\n\n    const denom = Math.max(incomeTotal, expenseTotal, 1);\n    const pct = Math.min(100, Math.round((Math.abs(net) / denom) * 100));\n    meterEl.className = 'meter-fill ' + (isPlus ? 'plus' : 'minus');\n    meterEl.style.width = pct + '%';\n  }\n\n  function renderList(type){\n    const listEl = document.getElementById(type + 'List');\n    const items = getFilteredEntries(type);\n    listEl.innerHTML = '';\n    \n    if(items.length === 0){\n      const empty = document.createElement('div');\n      empty.className = 'empty';\n      empty.textContent = 'この月の項目はまだありません';\n      listEl.appendChild(empty);\n      return;\n    }\n\n    items.sort((a,b) => new Date(a.date) - new Date(b.date));\n\n    items.forEach((item) => {\n      const li = document.createElement('li');\n\n      const dateBadge = document.createElement('span');\n      dateBadge.className = 'date-badge';\n      dateBadge.textContent = item.date.slice(5);\n\n      const name = document.createElement('span');\n      name.className = 'name';\n      name.textContent = item.name;\n      name.addEventListener('click', () => {\n        const newName = prompt('項目名を編集:', item.name);\n        if(newName !== null && newName.trim() !== '') {\n          item.name = newName.trim();\n          render();\n        }\n      });\n\n      const amt = document.createElement('span');\n      amt.className = 'amt';\n      amt.textContent = fmt(item.amount);\n      amt.addEventListener('click', () => {\n        const newAmt = prompt('金額を編集:', item.amount);\n        if(newAmt !== null && !isNaN(newAmt) && newAmt.trim() !== '') {\n          item.amount = parseFloat(newAmt);\n          render();\n        }\n      });\n\n      const del = document.createElement('button');\n      del.className = 'del';\n      del.textContent = '×';\n      del.addEventListener('click', () => {\n        const idx = state[type].findIndex(e => e === item);\n        if(idx > -1) {\n          state[type].splice(idx, 1);\n          render();\n        }\n      });\n\n      li.appendChild(dateBadge);\n      li.appendChild(name);\n      li.appendChild(amt);\n      li.appendChild(del);\n      listEl.appendChild(li);\n    });\n  }\n\n  function renderCardBreakdown() {\n    const container = document.getElementById('cardBreakdownList');\n    container.innerHTML = '';\n    const expenseList = getFilteredEntries('expense');\n    const totalExpense = expenseList.reduce((s,e)=>s+e.amount, 0);\n\n    presets.expense.forEach(cardName => {\n      const cardTotal = expenseList.filter(e => e.name === cardName).reduce((s,e)=>s+e.amount, 0);\n      if(cardTotal > 0) {\n        const pct = totalExpense > 0 ? Math.round((cardTotal / totalExpense) * 100) : 0;\n        \n        const itemDiv = document.createElement('div');\n        itemDiv.className = 'card-bar-item';\n        itemDiv.innerHTML = `\n          <div class=\"card-bar-info\">\n            <span>${cardName}<\/span>\n            <span>${fmt(cardTotal)} (${pct}%)<\/span>\n          <\/div>\n          <div class=\"card-bar-track\">\n            <div class=\"card-bar-fill\" style=\"width: ${pct}%\"><\/div>\n          <\/div>\n        `;\n        container.appendChild(itemDiv);\n      }\n    });\n\n    if(container.innerHTML === '') {\n      container.innerHTML = '<div class=\"empty\" style=\"padding:4px 0;\">カード別の支出データはありません<\/div>';\n    }\n  }\n\n  function renderTrend() {\n    const container = document.getElementById('trendBars');\n    container.innerHTML = '';\n\n    for(let i = 3; i >= 0; i--){\n      const d = new Date(viewingDate.getFullYear(), viewingDate.getMonth() - i, 1);\n      const y = d.getFullYear();\n      const m = d.getMonth();\n\n      const inc = state.income.filter(e => {\n        const ed = new Date(e.date);\n        return ed.getFullYear() === y && ed.getMonth() === m;\n      }).reduce((s,e)=>s+e.amount, 0);\n\n      const exp = state.expense.filter(e => {\n        const ed = new Date(e.date);\n        return ed.getFullYear() === y && ed.getMonth() === m;\n      }).reduce((s,e)=>s+e.amount, 0);\n\n      const net = inc - exp;\n      const isPlus = net >= 0;\n      const maxVal = Math.max(...Array.from({length:4}, (_, idx) => {\n        const td = new Date(viewingDate.getFullYear(), viewingDate.getMonth() - (3 - idx), 1);\n        const ty = td.getFullYear(), tm = td.getMonth();\n        const ti = state.income.filter(e=>new Date(e.date).getFullYear()===ty && new Date(e.date).getMonth()===tm).reduce((s,e)=>s+e.amount,0);\n        const te = state.expense.filter(e=>new Date(e.date).getFullYear()===ty && new Date(e.date).getMonth()===tm).reduce((s,e)=>s+e.amount,0);\n        return Math.max(ti, te);\n      }), 1);\n\n      const heightPct = Math.min(100, Math.max(10, Math.round((Math.abs(net) / maxVal) * 100)));\n\n      const col = document.createElement('div');\n      col.className = 'trend-col';\n      col.innerHTML = `\n        <div style=\"font-size:11px; color:var(--gray); margin-bottom:4px; font-variant-numeric:tabular-nums;\">${isPlus?fmt(net):'−'+fmt(Math.abs(net))}<\/div>\n        <div class=\"trend-bar-wrapper\">\n          <div class=\"trend-bar-fill ${isPlus?'plus':'minus'}\" style=\"height: ${heightPct}%\"><\/div>\n        <\/div>\n        <div class=\"trend-label\">${m+1}月<\/div>\n      `;\n      container.appendChild(col);\n    }\n  }\n\n  function exportCSV() {\n    let csv = '\\uFEFF日付,種別,項目,金額\\n';\n    state.income.forEach(e => {\n      csv += `${e.date},収入,\"${e.name}\",${e.amount}\\n`;\n    });\n    state.expense.forEach(e => {\n      csv += `${e.date},支出,\"${e.name}\",${e.amount}\\n`;\n    });\n\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = `shushicho_backup_${getTodayString()}.csv`;\n    a.click();\n    URL.revokeObjectURL(url);\n  }\n\n  function setupForm(type){\n    const form = document.getElementById(type + 'Form');\n    form.addEventListener('submit', e => {\n      e.preventDefault();\n      const dateInput = form.querySelector('.f-date');\n      const nameInput = form.querySelector('.f-name');\n      const amountInput = form.querySelector('.f-amount');\n      \n      const date = dateInput.value;\n      const name = nameInput.value.trim();\n      const amount = parseFloat(amountInput.value);\n      \n      if(!date || !name || isNaN(amount) || amount < 0) return;\n\n      state[type].push({ date, name, amount });\n      nameInput.value = '';\n      amountInput.value = '';\n      nameInput.focus();\n      render();\n    });\n  }\n\n  setupForm('income');\n  setupForm('expense');\n  renderChips('income');\n  renderChips('expense');\n  render();\n<\/script>\n<\/body>\n<\/html>", "resale": "<!DOCTYPE html>\n<html lang=\"ja\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>転売利益トラッカー<\/title>\n<style>\n:root{--bg:#f6f7f9;--card:#fff;--tx:#1c1f24;--sub:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--ok:#15803d;--ng:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#14161a;--card:#1e2126;--tx:#eceff3;--sub:#9aa3af;--bd:#2f343b;--ac:#6ea0ff;--ok:#4ade80;--ng:#f87171}}\n:root[data-theme=\"dark\"]{--bg:#14161a;--card:#1e2126;--tx:#eceff3;--sub:#9aa3af;--bd:#2f343b;--ac:#6ea0ff;--ok:#4ade80;--ng:#f87171}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,\"Hiragino Sans\",\"Noto Sans JP\",sans-serif;font-size:15px}\nmain{max-width:940px;margin:0 auto;padding:16px}\nh1{font-size:20px;margin:4px 0 12px}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}\n.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}\n.sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}\n.sum small{color:var(--sub);display:block;font-size:12px}.sum b{font-size:18px}\nform{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}\nlabel{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}\ninput,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%;box-sizing:border-box}\nbutton{font:inherit;padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}\nbutton.g{background:transparent;color:var(--sub);border:1px solid var(--bd);padding:5px 9px}\n.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}\nth,td{padding:6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}\nth:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--sub);font-weight:500}\ntd input{width:78px;padding:5px}\n.p{color:var(--ok)}.n{color:var(--ng)}.tag{font-size:12px;color:var(--sub)}\n.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n<\/style><\/head><body><main>\n<h1>📦 転売利益トラッカー<\/h1>\n<div class=\"sum\" id=\"sum\"><\/div>\n<div class=\"card\" id=\"cc\" style=\"margin-top:14px\"><b>💰 入札上限を計算<\/b>\n<form onsubmit=\"return false\" style=\"margin-top:8px\">\n<label>想定売値(1点)<input id=\"c_s\" type=\"number\" min=\"0\" inputmode=\"numeric\"><\/label>\n<label>目標利益率(%)<input id=\"c_t\" type=\"number\" min=\"0\" step=\"0.1\" value=\"30\"><\/label>\n<label>点数(まとめ買い)<input id=\"c_n\" type=\"number\" min=\"1\" value=\"1\"><\/label>\n<label>仕入れ送料(合計)<input id=\"c_b\" type=\"number\" min=\"0\" value=\"0\"><\/label>\n<label>発送料(1点)<input id=\"c_x\" type=\"number\" min=\"0\" value=\"210\"><\/label>\n<label>梱包等(1点)<input id=\"c_e\" type=\"number\" min=\"0\" value=\"0\"><\/label>\n<label>手数料率(%)<input id=\"c_r\" type=\"number\" min=\"0\" step=\"0.1\" value=\"10\"><\/label>\n<\/form><div id=\"c_out\" style=\"margin-top:10px\"><\/div><\/div>\n<div class=\"card\" style=\"margin-top:0\"><form id=\"f\">\n<label style=\"grid-column:1/-1\">仕入れ名(まとめ買いならセット名)<input id=\"name\" required><\/label>\n<label>仕入れ値(合計)<input id=\"buy\" type=\"number\" min=\"0\" required><\/label>\n<label>仕入れ送料(合計)<input id=\"bship\" type=\"number\" min=\"0\" value=\"0\"><\/label>\n<label>手数料率(%)<input id=\"rate\" type=\"number\" min=\"0\" step=\"0.1\" value=\"10\"><\/label>\n<label style=\"grid-column:1/-1\">中身の商品(1行1つ。空欄なら1点扱い)<textarea id=\"its\" rows=\"3\" placeholder=\"例:&#10;ゲームソフトA&#10;ゲームソフトB\"><\/textarea><\/label>\n<div style=\"display:flex;align-items:end\"><button>追加<\/button><\/div>\n<\/form><\/div>\n<div id=\"pay\"><\/div>\n<div id=\"lots\"><\/div>\n<div class=\"row\"><button class=\"g\" id=\"cp\">表をコピー<\/button><span class=\"tag\">発送料は初期値210円(各行で変更可)・データはこのブラウザに自動保存。まとめ買いの原価は点数で均等に按分。売値を入れると売却済みになります<\/span><\/div>\n<details class=\"card\"><summary>貼り付けて読み込み<\/summary><textarea id=\"imp\" rows=\"4\" style=\"margin-top:8px\" placeholder=\"「表をコピー」した内容をここに貼り付け\"><\/textarea>\n<div class=\"row\" style=\"margin-top:8px\"><button id=\"ia\">追加で読み込む<\/button><button class=\"g\" id=\"ir\">置き換えて読み込む<\/button><span class=\"tag\" id=\"im\"><\/span><\/div><\/details>\n<\/main>\n<script>\nconst SHIP=210,K=\"resale-lots-v2\";let lots=[];\ntry{lots=JSON.parse(localStorage.getItem(K)||\"[]\");\nif(!lots.length){const o=JSON.parse(localStorage.getItem(\"resale-items-v1\")||\"[]\");\nlots=o.map(i=>({name:i.name,buy:i.buy,bship:i.bship,rate:i.rate,items:[{n:i.name,sell:i.sell,sship:i.sship,etc:i.etc}]}))}}catch(e){lots=[]}\nlots.forEach(l=>{if(l.paid){l.items.forEach(i=>{if(i.paid==null)i.paid=true});delete l.paid}});\nconst save=()=>{try{localStorage.setItem(K,JSON.stringify(lots))}catch(e){}};\nconst yen=n=>\"¥\"+Math.round(n).toLocaleString(\"ja-JP\");\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst cls=v=>v>=0?\"p\":\"n\";\nfunction calc(l,it){const cost=(l.buy+l.bship)/Math.max(1,l.items.length);\nif(it.sell==null)return{cost,sold:false};\nconst fee=Math.floor(it.sell*l.rate/100),other=it.sship+it.etc,net=it.sell-fee-other;\nreturn{cost,sold:true,fee,other,net,profit:net-cost,rate:it.sell?(net-cost)/it.sell*100:0}}\nfunction render(){\nlet sales=0,pr=0,stock=0,cnt=0;\nconst sd=[];lots.forEach((l,x)=>l.items.forEach((it,y)=>{if(it.sell!=null)sd.push({x,y,l,it,c:(l.buy+l.bship)/Math.max(1,l.items.length)})}));\nconst unpaid=sd.reduce((a,d)=>a+(d.it.paid?0:d.c),0);\n$(\"pay\").innerHTML=sd.length?`<div class=\"card\"><div class=\"row\" style=\"margin-bottom:6px\"><b>💳 クレカ分の入金<\/b><span class=\"tag\">売れた商品だけ・入金したらチェック<\/span><span style=\"flex:1\"><\/span><span>未入金 <b class=\"${unpaid?\"n\":\"p\"}\" style=\"font-size:20px\">${yen(unpaid)}<\/b><\/span><\/div>`+sd.map(d=>`<label style=\"flex-direction:row;align-items:center;gap:8px;font-size:14px;color:${d.it.paid?\"var(--sub)\":\"var(--tx)\"};padding:7px 0;border-top:1px solid var(--bd);${d.it.paid?\"text-decoration:line-through;\":\"\"}\"><input type=\"checkbox\" data-pay=\"${d.x}-${d.y}\" style=\"width:auto\"${d.it.paid?\" checked\":\"\"}><span style=\"flex:1\">${esc(d.it.n)}${d.l.items.length>1?` <span class=\"tag\">(${esc(d.l.name)})<\/span>`:\"\"}<\/span><span>${yen(d.c)}<\/span><\/label>`).join(\"\")+`<div class=\"tag\" style=\"margin-top:6px\">金額は仕入れ値+仕入れ送料(まとめ買いは点数で按分)<\/div><\/div>`:'<div class=\"card tag\">💳 売れた商品がここに出るよ<\/div>';\n$(\"lots\").innerHTML=lots.map((l,x)=>{\nconst lc=l.buy+l.bship;let rec=0,sold=0;\nconst rows=l.items.map((it,y)=>{const c=calc(l,it);\nif(c.sold){sold++;rec+=c.net;sales+=it.sell;pr+=c.profit;cnt++}else stock+=c.cost;\nconst inp=(k,v,ph)=>`<input type=\"number\" min=\"0\" data-x=\"${x}\" data-y=\"${y}\" data-k=\"${k}\" value=\"${v??\"\"}\" placeholder=\"${ph}\">`;\nreturn `<tr><td>${esc(it.n)}${c.sold?\"\":' <span class=\"tag\">在庫<\/span>'}<\/td><td>${yen(c.cost)}<\/td><td>${inp(\"sell\",it.sell,\"売値\")}<\/td>\n<td>${c.sold?yen(c.fee):\"-\"}<\/td><td>${inp(\"sship\",it.sship,\"発送料\")}<\/td><td>${inp(\"etc\",it.etc,\"梱包等\")}<\/td>\n<td class=\"${c.sold?cls(c.profit):\"\"}\">${c.sold?yen(c.profit):\"-\"}<\/td><td class=\"${c.sold?cls(c.profit):\"\"}\">${c.sold?c.rate.toFixed(1)+\"%\":\"-\"}<\/td>\n<td><button class=\"g\" data-di=\"${x}-${y}\">×<\/button><\/td><\/tr>`}).join(\"\");\nconst bal=rec-lc;\nreturn `<div class=\"card\"><div class=\"row\" style=\"margin-bottom:6px\"><b>${esc(l.name)}<\/b>\n<span class=\"tag\">仕入れ計 ${yen(lc)}(送料込)・${sold}/${l.items.length}点売却・回収済み ${yen(rec)}<\/span>\n<span class=\"${cls(bal)}\" style=\"font-weight:600\">全体損益 ${yen(bal)}<\/span><span style=\"flex:1\"><\/span>\n<button class=\"g\" data-add=\"${x}\">+商品<\/button><button class=\"g\" data-dl=\"${x}\">削除<\/button><\/div>\n<div class=\"wrap\"><table><thead><tr><th>商品<\/th><th>原価(按分)<\/th><th>売値<\/th><th>手数料<\/th><th>発送料<\/th><th>梱包等<\/th><th>利益<\/th><th>利益率<\/th><th><\/th><\/tr><\/thead><tbody>${rows}<\/tbody><\/table><\/div><\/div>`}).join(\"\")||'<div class=\"card tag\">まだ何もありません<\/div>';\n$(\"sum\").innerHTML=[[\"売上合計\",yen(sales)],[\"利益合計(売却済み)\",`<span class=\"${cls(pr)}\">${yen(pr)}<\/span>`],[\"平均利益率\",sales?(pr/sales*100).toFixed(1)+\"%\":\"-\"],[\"売却済み\",cnt+\"点\"],[\"在庫の原価\",yen(stock)],[\"未入金(クレカ)\",`<span class=\"${unpaid?\"n\":\"p\"}\">${yen(unpaid)}<\/span>`]].map(a=>`<div><small>${a[0]}<\/small><b>${a[1]}<\/b><\/div>`).join(\"\")}\nconst num=id=>Number($(id).value)||0;\n$(\"f\").onsubmit=e=>{e.preventDefault();const name=$(\"name\").value.trim();\nlet names=$(\"its\").value.split(\"\\n\").map(s=>s.trim()).filter(Boolean);if(!names.length)names=[name];\nlots.unshift({name,buy:num(\"buy\"),bship:num(\"bship\"),rate:num(\"rate\"),items:names.map(n=>({n,sell:null,sship:SHIP,etc:0}))});\nsave();e.target.reset();$(\"rate\").value=10;$(\"bship\").value=0;render()};\n$(\"pay\").onchange=e=>{const d=e.target.dataset.pay;if(d==null)return;const[x,y]=d.split(\"-\").map(Number);lots[x].items[y].paid=e.target.checked;save();render()};\n$(\"lots\").onclick=e=>{const d=e.target.dataset;\nif(d.dl!=null&&confirm(\"このまとめごと削除する?\")){lots.splice(d.dl,1)}\nelse if(d.di!=null){const[x,y]=d.di.split(\"-\").map(Number);lots[x].items.splice(y,1);if(!lots[x].items.length)lots.splice(x,1)}\nelse if(d.add!=null){const n=prompt(\"商品名\");if(n)lots[d.add].items.push({n,sell:null,sship:SHIP,etc:0})}\nelse return;save();render()};\n$(\"lots\").onchange=e=>{const d=e.target.dataset;if(d.k==null)return;\nconst v=e.target.value;lots[d.x].items[d.y][d.k]=v===\"\"?(d.k===\"sell\"?null:0):Number(v);save();render()};\n$(\"cp\").onclick=async()=>{const r=[\"まとめ\\t仕入れ値\\t仕入れ送料\\t手数料率\\t商品\\t売値\\t発送料\\t梱包等\\t原価(按分)\\t手数料\\t利益\\t入金済み\"];\nlots.forEach(l=>l.items.forEach(it=>{const c=calc(l,it);r.push([l.name,l.buy,l.bship,l.rate,it.n,it.sell??\"\",it.sship,it.etc,Math.round(c.cost),c.fee??\"\",c.profit==null?\"\":Math.round(c.profit),it.paid?1:\"\"].join(\"\\t\"))}));\ntry{await navigator.clipboard.writeText(r.join(\"\\n\"));$(\"cp\").textContent=\"コピーした!\"}catch(e){$(\"cp\").textContent=\"コピー失敗\"}setTimeout(()=>$(\"cp\").textContent=\"表をコピー\",1500)};\nconst msg=t=>{$(\"im\").textContent=t};\nfunction imp(mode){const txt=$(\"imp\").value.trim();if(!txt){msg(\"貼り付け欄が空\");return}\nconst n=s=>{const v=parseFloat(String(s??\"\").replace(/[¥,円%\\s]/g,\"\"));return isNaN(v)?null:v};\nconst map=new Map();let old=false;\ntxt.split(/\\r?\\n/).forEach(line=>{const c=line.split(\"\\t\");\nif(c[0]===\"まとめ\"){if(c[1]===\"商品\")old=true;return}\nif(c.length<5)return;\nconst buy=n(c[1])||0,bship=n(c[2])||0,rate=n(c[3])??10,key=[c[0],buy,bship,rate].join(\"|\");\nif(!map.has(key))map.set(key,{name:c[0],buy,bship,rate,items:[]});\nmap.get(key).items.push({n:c[4],sell:n(c[5]),sship:n(c[6])??SHIP,etc:n(c[7])||0,paid:c[11]===\"1\"})});\nif(old){msg(\"古い形式のコピーは読み込めない(仕入れ値が入ってない)\");return}\nconst arr=[...map.values()];if(!arr.length){msg(\"読み込める行がなかった\");return}\nif(mode===\"replace\"){if(!confirm(\"今のデータを全部置き換える?\"))return;lots=arr}else lots=arr.concat(lots);\nsave();render();$(\"imp\").value=\"\";msg(arr.length+\"セット読み込んだ\")}\n$(\"ia\").onclick=()=>imp(\"add\");$(\"ir\").onclick=()=>imp(\"replace\");\nfunction calcMax(){const g=id=>Number($(id).value)||0;\nconst v=g(\"c_s\"),t=g(\"c_t\"),n=Math.max(1,Math.floor(g(\"c_n\"))),r=g(\"c_r\"),sh=g(\"c_x\"),e=g(\"c_e\"),b=g(\"c_b\");\nif(!v){$(\"c_out\").innerHTML='<span class=\"tag\">想定売値を入れると上限額が出るよ<\/span>';return}\nconst fee=Math.floor(v*r/100),prof=v*t/100,max=Math.floor(n*(v-fee-sh-e-prof)-b);\nif(max<=0){$(\"c_out\").innerHTML='<span class=\"n\">この条件だと目標利益率に届かない(売値が低いか経費が高い)<\/span>';return}\n$(\"c_out\").innerHTML=`<div>入札上限(合計) <b style=\"font-size:24px\" class=\"p\">${yen(max)}<\/b><\/div>\n<div class=\"tag\" style=\"margin-top:4px\">${n>1?`1点あたり約${yen(max/n)}・`:\"\"}想定利益 ${yen(n*prof) g: 3px 0 3px 7px;\n    font-size: 12px;\n    font-weight: 500;\n    color: var(--text-main);\n    position: relative;\n    transition: background 0.05s, border-color 0.05s, transform 0.04s, box-shadow 0.04s;\n    user-select: none;\n  }\n  .key .main { font-size: 12.5px; font-weight: 500; line-height: 1.15; }\n  .key .sub-label { font-size: 10px; color: var(--text-sub); font-weight: 400; line-height: 1.1; }\n  .key.center { align-items: center; justify-content: center; padding-left: 0; }\n  .key.small-label .main { font-size: 10.5px; }\n\n  .key.pressed {\n    background: var(--accent);\n    border-color: var(--accent);\n    box-shadow: none;\n    transform: translateY(2px);\n    border-bottom-width: 1px;\n  }\n  .key.pressed .main, .key.pressed .sub-label { color: #fff; }\n\n  .key.tested::after {\n    content: \"\";\n    position: absolute;\n    top: 4px;\n    right: 4px;\n    width: 6px;\n    height: 6px;\n    border-radius: 50%;\n    background: var(--accent2);\n  }\n\n  .w1 { width: 42px; }\n  .w1_5 { width: 65px; }\n  .w2 { width: 88px; }\n  .w2_25 { width: 100px; }\n  .space { width: 292px; }\n\n  .enter-block { position: relative; display: flex; flex-direction: column; gap: 7px; align-self: flex-start; }\n  .enter-block .row { padding-right: 72px; }\n  .key.enter-key {\n    position: absolute;\n    top: 0; right: 0;\n    width: 65px;\n    height: 91px;\n    align-items: center;\n    justify-content: center;\n    text-align: center;\n    padding-left: 0;\n  }\n  .key.enter-key .main { font-size: 11px; }\n\n  .arrow-stack {\n    display: flex;\n    flex-direction: column;\n    gap: 3px;\n    width: 42px;\n  }\n  .arrow-stack .key {\n    height: 19px;\n    width: 42px;\n    align-items: center;\n    justify-content: center;\n    padding: 0;\n  }\n  .arrow-stack .key .main { font-size: 10px; }\n\n  .legend {\n    display: flex;\n    gap: 18px;\n    font-size: 12px;\n    color: var(--text-sub);\n    margin-top: 14px;\n    flex-wrap: wrap;\n  }\n  .legend .dot {\n    display: inline-block;\n    width: 8px; height: 8px;\n    border-radius: 50%;\n    margin-right: 5px;\n  }\n  .dot.p { background: var(--accent); }\n  .dot.t { background: var(--accent2); }\n\n  .log {\n    font-family: \"SF Mono\", Menlo, monospace;\n    font-size: 12px;\n    background: #f5f5f7;\n    border-radius: 10px;\n    padding: 10px;\n    height: 140px;\n    overflow-y: auto;\n    color: #0071e3;\n    line-height: 1.6;\n  }\n  .log div.err { color: var(--danger); }\n  .note {\n    font-size: 12px;\n    color: var(--text-sub);\n    margin-top: 10px;\n  }\n<\/style>\n<\/head>\n<body>\n\n<h1>⌨️ A1644 キーボード動作確認サイト（日本語配列 / JIS）<\/h1>\n<div class=\"sub\">各キーを実際に押して、反応するか・正しいキーとして認識されるかを確認してください。押したキーは青く光り、一度でも反応したキーには緑の印が付きます。<\/div>\n\n<div class=\"panel\">\n  <div class=\"status-row\">\n    <div><span class=\"label\">直近のキー:<\/span><b id=\"lastKey\">-<\/b><\/div>\n    <div><span class=\"label\">key:<\/span><span id=\"lastKeyVal\">-<\/span><\/div>\n    <div><span class=\"label\">code:<\/span><span id=\"lastCode\">-<\/span><\/div>\n    <div><span class=\"label\">keyCode:<\/span><span id=\"lastKeyCode\">-<\/span><\/div>\n  <\/div>\n  <div class=\"stats\">\n    <div class=\"stat\">テスト済み: <b id=\"testedCount\">0<\/b> / <span id=\"totalCount\">0<\/span><\/div>\n    <div class=\"stat\">未反応キー: <b id=\"untestedList\">全キー<\/b><\/div>\n    <button id=\"resetBtn\">リセット<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"panel\">\n  <div class=\"keyboard-frame\">\n    <div class=\"keyboard\" id=\"keyboard\"><\/div>\n  <\/div>\n  <div class=\"legend\">\n    <div><span class=\"dot p\"><\/span>現在押されている<\/div>\n    <div><span class=\"dot t\"><\/span>一度でも反応した<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"panel\">\n  <div class=\"sub\" style=\"margin-bottom:8px;\">イベントログ（最新が上）<\/div>\n  <div class=\"log\" id=\"log\"><\/div>\n  <div class=\"note\">\n    ※ 「未反応キー」が最後まで残る場合、そのキーが物理的に反応していない可能性があります。fn・かな・英数などのキーはブラウザやOSによって検出できない場合があります。<br>\n    ※ enterキーだけ反応しない場合は、キー自体の故障よりも「チャット側にEnterキー入力が取られている」ケースが多いです。一度この画面（プレビュー部分）を1回クリックしてからテストするか、ダウンロードしてブラウザで直接開いて試してください。\n  <\/div>\n<\/div>\n\n<script>\n// Apple Magic Keyboard 日本語配列(JIS) 相当のレイアウト定義\n// main: メイン表示, sub: かな/記号の補助表示, code: KeyboardEvent.code\nfunction k(code, main, sub, w) { return {code, main, sub: sub || \"\", w: w || \"w1\"}; }\n\nconst row1 = [\n  k(\"Escape\", \"esc\", \"\", \"w1\"),\n  k(\"F1\", \"🔅\", \"F1\", \"w1\"), k(\"F2\", \"🔆\", \"F2\", \"w1\"),\n  k(\"F3\", \"▭▭\", \"F3\", \"w1\"), k(\"F4\", \"▦▦\", \"F4\", \"w1\"),\n  k(\"F5\", \"\", \"F5\", \"w1\"), k(\"F6\", \"\", \"F6\", \"w1\"),\n  k(\"F7\", \"⏮\", \"F7\", \"w1\"), k(\"F8\", \"⏯\", \"F8\", \"w1\"),\n  k(\"F9\", \"⏭\", \"F9\", \"w1\"), k(\"F10\", \"🔇\", \"F10\", \"w1\"),\n  k(\"F11\", \"🔉\", \"F11\", \"w1\"), k(\"F12\", \"🔊\", \"F12\", \"w1\"),\n  k(\"Eject\", \"⏏\", \"\", \"w1_5\"),\n];\n\nconst row2 = [\n  k(\"Digit1\", \"1\", \"ぬ\", \"w1\"), k(\"Digit2\", \"2\", \"ふ\", \"w1\"),\n  k(\"Digit3\", \"3\", \"あ\", \"w1\"), k(\"Digit4\", \"4\", \"う\", \"w1\"),\n  k(\"Digit5\", \"5\", \"え\", \"w1\"), k(\"Digit6\", \"6\", \"お\", \"w1\"),\n  k(\"Digit7\", \"7\", \"や\", \"w1\"), k(\"Digit8\", \"8\", \"ゆ\", \"w1\"),\n  k(\"Digit9\", \"9\", \"よ\", \"w1\"), k(\"Digit0\", \"0\", \"わ\", \"w1\"),\n  k(\"Minus\", \"-\", \"ほ\", \"w1\"), k(\"Equal\", \"^\", \"へ\", \"w1\"),\n  k(\"IntlYen\", \"¥\", \"|\", \"w1\"),\n  k(\"Backspace\", \"delete\", \"\", \"w1_5\"),\n];\n\nconst row3 = [\n  k(\"Tab\", \"tab\", \"\", \"w1_5\"),\n  k(\"KeyQ\", \"Q\", \"た\", \"w1\"), k(\"KeyW\", \"W\", \"て\", \"w1\"),\n  k(\"KeyE\", \"E\", \"い\", \"w1\"), k(\"KeyR\", \"R\", \"す\", \"w1\"),\n  k(\"KeyT\", \"T\", \"か\", \"w1\"), k(\"KeyY\", \"Y\", \"ん\", \"w1\"),\n  k(\"KeyU\", \"U\", \"な\", \"w1\"), k(\"KeyI\", \"I\", \"に\", \"w1\"),\n  k(\"KeyO\", \"O\", \"ら\", \"w1\"), k(\"KeyP\", \"P\", \"せ\", \"w1\"),\n  k(\"BracketLeft\", \"@\", \"゛\", \"w1\"), k(\"BracketRight\", \"[\", \"「\", \"w1\"),\n];\n\nconst row4 = [\n  k(\"ControlLeft\", \"control\", \"\", \"w1_5\"),\n  k(\"KeyA\", \"A\", \"ち\", \"w1\"), k(\"KeyS\", \"S\", \"と\", \"w1\"),\n  k(\"KeyD\", \"D\", \"し\", \"w1\"), k(\"KeyF\", \"F\", \"は\", \"w1\"),\n  k(\"KeyG\", \"G\", \"き\", \"w1\"), k(\"KeyH\", \"H\", \"く\", \"w1\"),\n  k(\"KeyJ\", \"J\", \"ま\", \"w1\"), k(\"KeyK\", \"K\", \"の\", \"w1\"),\n  k(\"KeyL\", \"L\", \"り\", \"w1\"), k(\"Semicolon\", \"+\", \"れ\", \"w1\"),\n  k(\"Quote\", \"*\", \"け\", \"w1\"), k(\"Backslash\", \"}\", \"む\", \"w1\"),\n];\n\nconst enterKey = k(\"Enter\", \"enter\", \"return\", \"\");\n\nconst row5 = [\n  k(\"ShiftLeft\", \"shift\", \"\", \"w2\"),\n  k(\"KeyZ\", \"Z\", \"っ\", \"w1\"), k(\"KeyX\", \"X\", \"さ\", \"w1\"),\n  k(\"KeyC\", \"C\", \"そ\", \"w1\"), k(\"KeyV\", \"V\", \"ひ\", \"w1\"),\n  k(\"KeyB\", \"B\", \"こ\", \"w1\"), k(\"KeyN\", \"N\", \"み\", \"w1\"),\n  k(\"KeyM\", \"M\", \"も\", \"w1\"), k(\"Comma\", \"<\", \"ね\", \"w1\"),\n  k(\"Period\", \">\", \"る\", \"w1\"), k(\"Slash\", \"?\", \"め\", \"w1\"),\n  k(\"IntlRo\", \"ろ\", \"\", \"w1\"),\n  k(\"ShiftRight\", \"shift\", \"\", \"w2_25\"),\n];\n\nconst row6left = [\n  k(\"CapsLock\", \"caps\", \"\", \"w1_5\"),\n  k(\"AltLeft\", \"option\", \"\", \"w1_5\"),\n  k(\"MetaLeft\", \"command\", \"\", \"w1_5\"),\n  k(\"Lang2\", \"英数\", \"\", \"w1\"),\n];\nconst spaceKey = k(\"Space\", \"\", \"\", \"space\");\nconst row6right = [\n  k(\"Lang1\", \"かな\", \"\", \"w1\"),\n  k(\"MetaRight\", \"command\", \"\", \"w1_5\"),\n  k(\"Fn\", \"fn\", \"\", \"w1\"),\n];\n\nconst keyboardEl = document.getElementById(\"keyboard\");\nconst keyElMap = {};\nlet totalKeys = 0;\n\nfunction buildKey(kdef, extraClass) {\n  const el = document.createElement(\"div\");\n  el.className = \"key \" + (kdef.w || \"\") + (extraClass ? \" \" + extraClass : \"\");\n  if (!kdef.sub) el.classList.add(\"center\");\n  const mainEl = document.createElement(\"div\");\n  mainEl.className = \"main\";\n  mainEl.textContent = kdef.main;\n  el.appendChild(mainEl);\n  if (kdef.sub) {\n    const subEl = document.createElement(\"div\");\n    subEl.className = \"sub-label\";\n    subEl.textContent = kdef.sub;\n    el.appendChild(subEl);\n  }\n  el.dataset.code = kdef.code;\n  keyElMap[kdef.code] = el;\n  totalKeys++;\n  return el;\n}\n\nfunction buildRow(defs) {\n  const rowEl = document.createElement(\"div\");\n  rowEl.className = \"row\";\n  defs.forEach(d => rowEl.appendChild(buildKey(d)));\n  return rowEl;\n}\n\n// Row 1\nkeyboardEl.appendChild(buildRow(row1));\n// Row 2\nkeyboardEl.appendChild(buildRow(row2));\n\n// Row 3 + Row 4 with tall Enter key spanning both\nconst enterBlock = document.createElement(\"div\");\nenterBlock.className = \"enter-block\";\nenterBlock.appendChild(buildRow(row3));\nenterBlock.appendChild(buildRow(row4));\nconst enterEl = buildKey(enterKey, \"enter-key\");\nenterBlock.appendChild(enterEl);\nkeyboardEl.appendChild(enterBlock);\n\n// Row 5\nkeyboardEl.appendChild(buildRow(row5));\n\n// Row 6 (bottom row with space + arrow cluster)\nconst row6 = document.createElement(\"div\");\nrow6.className = \"row\";\nrow6left.forEach(d => row6.appendChild(buildKey(d)));\nrow6.appendChild(buildKey(spaceKey));\nrow6right.forEach(d => row6.appendChild(buildKey(d)));\n\n// Arrow cluster: left, up/down stack, right\nconst leftArrow = buildKey(k(\"ArrowLeft\", \"◄\", \"\", \"w1\"), \"center\");\nrow6.appendChild(leftArrow);\n\nconst stack = document.createElement(\"div\");\nstack.className = \"arrow-stack\";\nstack.appendChild(buildKey(k(\"ArrowUp\", \"▲\", \"\", \"\")));\nstack.appendChild(buildKey(k(\"ArrowDown\", \"▼\", \"\", \"\")));\nrow6.appendChild(stack);\n\nconst rightArrow = buildKey(k(\"ArrowRight\", \"►\", \"\", \"w1\"), \"center\");\nrow6.appendChild(rightArrow);\n\nkeyboardEl.appendChild(row6);\n\ndocument.getElementById(\"totalCount\").innerText = totalKeys;\n\nconst testedSet = new Set();\nconst logEl = document.getElementById(\"log\");\n\nfunction updateStats() {\n  document.getElementById(\"testedCount\").innerText = testedSet.size;\n  const untested = Object.keys(keyElMap).filter(c => !testedSet.has(c));\n  document.getElementById(\"untestedList\").innerText =\n    untested.length === 0 ? \"なし（全キー確認済み）\" :\n    untested.length === totalKeys ? \"全キー\" :\n    untested.length + \"個\";\n}\nupdateStats();\n\nfunction addLog(text, isErr) {\n  const line = document.createElement(\"div\");\n  if (isErr) line.className = \"err\";\n  const t = new Date().toLocaleTimeString(\"ja-JP\", {hour12:false});\n  line.innerText = \"[\" + t + \"] \" + text;\n  logEl.prepend(line);\n  while (logEl.children.length > 100) logEl.removeChild(logEl.lastChild);\n}\n\n// このプレビューが埋め込み枠(iframe)内でも確実にキー入力を受け取れるよう、\n// ページ読み込み時に明示的にフォーカスを取得しておく\ndocument.body.setAttribute(\"tabindex\", \"-1\");\nwindow.addEventListener(\"load\", () => {\n  window.focus();\n  document.body.focus();\n});\ndocument.addEventListener(\"click\", () => {\n  document.body.focus();\n});\n\nwindow.addEventListener(\"keydown\", (e) => {\n  e.preventDefault();\n  e.stopPropagation();\n  const el = keyElMap[e.code];\n  document.getElementById(\"lastKey\").innerText = e.code;\n  document.getElementById(\"lastKeyVal\").innerText = e.key;\n  document.getElementById(\"lastCode\").innerText = e.code;\n  document.getElementById(\"lastKeyCode\").innerText = e.keyCode;\n\n  if (el) {\n    el.classList.add(\"pressed\");\n    el.classList.add(\"tested\");\n    testedSet.add(e.code);\n    updateStats();\n    addLog(\"押下: \" + e.code + \" (key=\" + e.key + \", keyCode=\" + e.keyCode + \")\");\n  } else {\n    addLog(\"未定義のキー: \" + e.code + \" (key=\" + e.key + \", keyCode=\" + e.keyCode + \") — レイアウト外か特殊キーの可能性\", true);\n  }\n});\n\nwindow.addEventListener(\"keyup\", (e) => {\n  e.preventDefault();\n  e.stopPropagation();\n  const el = keyElMap[e.code];\n  if (el) el.classList.remove(\"pressed\");\n});\n\ndocument.getElementById(\"resetBtn\").addEventListener(\"click\", () => {\n  testedSet.clear();\n  Object.values(keyElMap).forEach(el => el.classList.remove(\"tested\", \"pressed\"));\n  updateStats();\n  logEl.innerHTML = \"\";\n  addLog(\"リセットしました\");\n});\n\nwindow.addEventListener(\"blur\", () => {\n  Object.values(keyElMap).forEach(el => el.classList.remove(\"pressed\"));\n});\n<\/script>\n\n<\/body>\n<\/html>\n"};
